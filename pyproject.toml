[project]
name = "softstudy"
version = "1.1.0"
description = "StudySoft — multi-course tutorial Q&A backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.0.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.0",
  "openai>=1.12.0",
  "scikit-learn>=1.3.0",
  "numpy>=1.24.0",
  "pypdf>=4.0.0",
  "python-docx>=1.1.0",
]

[tool.vercel]
entrypoint = "backend.server:app"
